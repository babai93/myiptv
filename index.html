	<body onload="Main.onLoad();" onunload="Main.onUnload();">
		<a href="javascript:void(0);" id="anchor" onkeydown="Main.keyDown(event);"></a>
		<div class="app-shell">
			<header class="topbar">
				<div class="brand"><span class="brand-mark">▶</span><span>my<span>iptv</span></span></div>
				<div class="topbar-title">Live television</div>
				<div class="sync-controls"><div id="sync-status" class="status-pill"><span></span><span class="sync-label">Last sync: waiting</span></div><button id="refresh-channels" class="refresh-button" type="button" aria-label="Refresh channel list" title="Refresh channel list">↻</button></div>
			</header>
			<main class="content-grid">
				<aside class="channel-sidebar">
					<div class="sidebar-heading"><div><h1>Channels</h1><span id="channel-count">Loading…</span></div><div class="live-dot"></div></div>
					<label class="search-box"><span>⌕</span><input id="channel-search" type="search" placeholder="Search channels"></label>
					<select id="category-filter" class="category-filter"><option value="">All categories</option></select>
					<div class="category-title">CATEGORIES <span id="category-count"></span></div>
					<div id="category-list" class="category-list"></div>
					<div id="channel-list" class="channel-list"></div>
				</aside>
				<section class="channels-column">
					<div class="page-heading"><div><p class="eyebrow">LIVE TV</p><h2>Choose a channel</h2></div><span class="hint">Select a channel to start watching</span></div>
					<div id="channel-grid" class="channel-grid"></div>
					<div id="channel-pagination" class="channel-pagination" aria-label="Channel pages"></div>
				</section>
			</main>

		<div id="player-modal" class="player-modal" aria-hidden="true">
			<div class="player-dialog" role="dialog" aria-modal="true" aria-label="Live channel player">
				<button id="player-close" class="player-close" type="button" aria-label="Close player">×</button>
				<div id="player-container"></div>
				<div id="loading">LOADING...</div>
				<div class="now-playing"><div class="now-playing-main"><img id="channel-logo" class="now-playing-logo" alt="" referrerpolicy="no-referrer" onerror="handleLogoError(this)"><div class="now-playing-copy"><div id="channel-name">Choose a channel</div><div class="now-label">NOW PLAYING</div></div></div>
				<div class="player-shortcuts" aria-label="Player shortcuts"><span><kbd>Esc</kbd> close</span><span><kbd>Space</kbd> play/pause</span><span><kbd>F</kbd> fullscreen</span><span><kbd>M</kbd> mute</span><span><kbd>←</kbd><kbd>→</kbd> seek 10s</span></div></div>
